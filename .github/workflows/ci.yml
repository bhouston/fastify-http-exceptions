name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, edited]
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate PR workflow and commits
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/check-pr.mjs
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
          if [ "$BASE_BRANCH" = dev ]; then
            pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
          fi
      - run: pnpm build
      - run: pnpm tsc
      - run: pnpm lint
      - run: pnpm test:release
      - run: pnpm test:coverage
      - name: Audit dependencies
        run: pnpm audit --audit-level high
      - run: pnpm release:prepare
      - name: Package size gate
        run: |
          pnpm size | tee size-report.txt
          cat size-report.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Verify package contents
        run: npm pack ./packages/fastify-http-exceptions/publish --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
      - uses: codecov/codecov-action@v5
        if: github.event_name != 'workflow_call'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
